<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AAVORA.ART — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<style>
:root { --cream:#F8F4EC; --beige:#E8DFD0; --white:#FFFFFF; --dark:#2E2A27;
  --muted:#7A726B; --rose:#B76E5E; --danger:#B00020; --border:#E8DFD0; --radius:10px; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system, BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--cream); color:var(--dark); line-height:1.5; }
header { background:var(--white); border-bottom:1px solid var(--border); padding:14px 24px;
  display:flex; justify-content:space-between; align-items:center; }
header .brand { font-weight:700; letter-spacing:0.14em; }
header button { background:none; border:1px solid var(--border); padding:6px 14px;
  border-radius:6px; cursor:pointer; color:var(--muted); }
header button:hover { border-color:var(--danger); color:var(--danger); }
main { max-width:1200px; margin:0 auto; padding:24px; }
.tabs { display:flex; gap:8px; margin-bottom:24px; }
.tabs button { padding:10px 20px; border:1px solid var(--border); background:var(--white);
  border-radius:8px; cursor:pointer; font:inherit; }
.tabs button.active { background:var(--dark); color:var(--white); border-color:var(--dark); }
.card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:24px; }
.btn { padding:9px 18px; border-radius:6px; border:1px solid var(--dark);
  background:transparent; color:var(--dark); cursor:pointer; font:inherit; }
.btn-primary { background:var(--rose); border-color:var(--rose); color:var(--white); }
.btn-small { padding:4px 10px; font-size:0.8rem; }
.btn-danger { border-color:var(--danger); color:var(--danger); }
.btn-danger:hover { background:var(--danger); color:var(--white); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
table { width:100%; border-collapse:collapse; font-size:0.9rem; }
th, td { padding:10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
th { font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
td.num { text-align:right; font-variant-numeric: tabular-nums; }
.form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.form-grid .full { grid-column:1/-1; }
.field { display:flex; flex-direction:column; gap:4px; }
.field label { font-size:0.8rem; color:var(--muted); }
.field input, .field select, .field textarea { padding:9px; border:1px solid var(--border);
  border-radius:6px; font:inherit; background:var(--cream); }
.error { color:var(--danger); background:#FDECEA; padding:10px; border-radius:6px; margin-bottom:12px; }
.hidden { display:none !important; }
.login-wrap { max-width:400px; margin:60px auto; }
.login-wrap h1 { text-align:center; margin-bottom:24px; }
#login-form { display:flex; flex-direction:column; gap:12px; }
#login-form input { padding:11px; border:1px solid var(--border); border-radius:6px; font:inherit; }
#login-form button { padding:12px; }
.status-chip { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.75rem;
  background:var(--beige); text-transform:uppercase; letter-spacing:0.03em; }
details summary { cursor:pointer; font-weight:600; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120%);
  background:var(--dark); color:var(--white); padding:12px 24px; border-radius:8px;
  font-size:0.9rem; z-index:1000; transition:transform 0.3s; max-width:calc(100% - 32px); }
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.error { background:var(--danger); }
</style>
</head>
<body>

<header>
  <div class="brand">AAVORA.ART <span style="font-weight:400;color:var(--muted);font-size:0.8rem;letter-spacing:0">— Admin</span></div>
  <button id="logout-btn" class="hidden" onclick="logout()">Logout</button>
</header>

<main>
  <div id="login-view" class="login-wrap">
    <h1>Admin Login</h1>
    <div id="login-error" class="error hidden"></div>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
  </div>

  <div id="dashboard-view" class="hidden">
    <div class="tabs">
      <button id="tab-products" class="active" data-tab="products">Products</button>
      <button id="tab-orders" data-tab="orders">Orders</button>
    </div>

    <section id="products-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="margin:0">Products</h2>
        <button class="btn btn-primary" id="add-product-btn">+ Add Product</button>
      </div>

      <div id="product-form-wrap" class="card hidden">
        <h3 id="product-form-title">Add Product</h3>
        <div id="product-form-error" class="error hidden"></div>
        <form id="product-form" class="form-grid">
          <input type="hidden" id="pf-id" />
          <div class="field full"><label>Product Name *</label><input id="pf-name" required maxlength="200" /></div>
          <div class="field full"><label>Description</label><textarea id="pf-description" rows="3" maxlength="2000"></textarea></div>
          <div class="field full">
            <label>Product Images (JPG, PNG, WebP — max 5 MB each, up to 10 images)</label>
            <input id="pf-files" type="file" accept="image/jpeg,image/png,image/webp" multiple />
            <small style="color:var(--muted)">Images upload securely to ImageKit after you save the product. Existing images are shown below.</small>
            <div id="pf-image-preview" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px"></div>
          </div>
          <div class="field full"><label>Optional external Image URL (HTTPS)</label>
            <input id="pf-image" type="url" placeholder="https://example.com/image.jpg" maxlength="500" /></div>
          <div class="field"><label>Category</label><input id="pf-category" value="General" maxlength="80" /></div>
          <div class="field"><label>Selling Price (₹) *</label>
            <input id="pf-price" type="number" min="1" step="1" required /></div>
          <div class="field"><label>Supplier Cost (₹) — private, admin only</label>
            <input id="pf-cost" type="number" min="0" step="1" value="0" /></div>
          <div class="field"><label>Variants (comma-separated, e.g. S,M,L)</label>
            <input id="pf-variants" placeholder="Default" /></div>
          <div class="field"><label>Available for sale</label>
            <select id="pf-available"><option value="1">Yes</option><option value="0">No</option></select></div>
          <div class="field full" style="flex-direction:row;gap:10px">
            <button type="submit" class="btn btn-primary">Save Product</button>
            <button type="button" class="btn" id="cancel-product-btn">Cancel</button>
          </div>
        </form>
      </div>

      <div class="card">
        <table>
          <thead><tr>
            <th>Name</th><th>Category</th>
            <th class="num">Selling Price</th><th class="num">Supplier Cost</th>
            <th class="num">Est. Profit</th><th class="num">Margin</th>
            <th>Variants</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody id="products-tbody"></tbody>
        </table>
      </div>
    </section>

    <section id="orders-section" class="hidden">
      <h2>Orders</h2>
      <div id="orders-list"></div>
    </section>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
const API_BASE = 'https://api.aavora.art';

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function formatINR(paise) { return '₹' + (paise / 100).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }

let toastTimer = null;
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    credentials: 'include',
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 401) { showLogin(); throw new Error('Unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}


let _editingImages = [];
let _selectedImageFiles = [];

function renderImagePreview() {
  const wrap = document.getElementById('pf-image-preview');
  if (!wrap) return;
  const saved = _editingImages.map((url, index) => `
    <div style="width:104px;position:relative;border:1px solid var(--border);border-radius:8px;padding:5px">
      <img src="${escapeHtml(url)}" alt="Product image ${index + 1}" style="width:92px;height:92px;object-fit:cover;border-radius:5px" />
      <button type="button" class="btn btn-small btn-danger" data-remove-image="${index}" style="width:100%;margin-top:4px">Remove</button>
    </div>`).join('');
  const pending = _selectedImageFiles.map((file, index) => `
    <div style="width:104px;border:1px dashed var(--border);border-radius:8px;padding:5px">
      <div style="height:92px;display:flex;align-items:center;justify-content:center;font-size:0.72rem;overflow-wrap:anywhere">${escapeHtml(file.name)}</div>
      <button type="button" class="btn btn-small btn-danger" data-remove-file="${index}" style="width:100%;margin-top:4px">Remove</button>
    </div>`).join('');
  wrap.innerHTML = saved + pending || '<small style="color:var(--muted)">No images selected.</small>';
}

document.getElementById('pf-image-preview').addEventListener('click', (e) => {
  const removeImage = e.target.closest('[data-remove-image]');
  const removeFile = e.target.closest('[data-remove-file]');
  if (removeImage) {
    _editingImages.splice(Number(removeImage.dataset.removeImage), 1);
    renderImagePreview();
  }
  if (removeFile) {
    _selectedImageFiles.splice(Number(removeFile.dataset.removeFile), 1);
    renderImagePreview();
  }
});

document.getElementById('pf-files').addEventListener('change', (e) => {
  const picked = Array.from(e.target.files || []);
  for (const file of picked) {
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
      showToast('Only JPG, PNG, or WebP images are allowed.', true);
      continue;
    }
    if (file.size > 5 * 1024 * 1024) {
      showToast(`${file.name}: maximum file size is 5 MB.`, true);
      continue;
    }
    if (_editingImages.length + _selectedImageFiles.length < 10)
      _selectedImageFiles.push(file);
    else {
      showToast('Maximum 10 images per product.', true);
      break;
    }
  }
  e.target.value = '';
  renderImagePreview();
});

async function uploadProductImage(productId, file) {
  const form = new FormData();
  form.append('file', file, file.name);
  const res = await fetch(API_BASE + '/api/admin/products/' + encodeURIComponent(productId) + '/images', {
    method: 'POST',
    credentials: 'include',
    body: form,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { showLogin(); throw new Error('Session expired. Please sign in again.'); }
  if (!res.ok) throw new Error(data.error || 'Image upload failed');
  return data.url;
}

function showLogin() {
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('dashboard-view').classList.add('hidden');
  document.getElementById('logout-btn').classList.add('hidden');
}
function showDashboard() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('dashboard-view').classList.remove('hidden');
  document.getElementById('logout-btn').classList.remove('hidden');
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  try {
    await api('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('login-email').value.trim(),
        password: document.getElementById('login-password').value,
      }),
    });
    showDashboard();
    loadProducts();
  } catch (err) {
    errEl.textContent = err.message === 'Unauthorized' ? 'Invalid email or password' : err.message;
    errEl.classList.remove('hidden');
  }
});

async function logout() {
  try { await api('/api/admin/logout', { method: 'POST' }); } catch {}
  showLogin();
}

document.querySelector('.tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-tab]');
  if (!btn) return;
  const name = btn.dataset.tab;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b === btn));
  document.getElementById('products-section').classList.toggle('hidden', name !== 'products');
  document.getElementById('orders-section').classList.toggle('hidden', name !== 'orders');
  if (name === 'orders') loadOrders();
});

/* ═══════════════ Products ═══════════════ */
let _productsCache = [];

async function loadProducts() {
  try {
    _productsCache = await api('/api/admin/products');
    const tbody = document.getElementById('products-tbody');
    tbody.innerHTML = _productsCache.map((p) => {
      let variants = [];
      try { variants = JSON.parse(p.variants || '[]'); } catch {}
      const profit = typeof p.estimated_profit === 'number'
        ? p.estimated_profit
        : (p.selling_price || 0) - (p.supplier_cost || 0);
      const margin = typeof p.profit_margin_pct === 'number'
        ? p.profit_margin_pct
        : (p.selling_price > 0 ? (profit / p.selling_price) * 100 : 0);
      return `<tr>
        <td>${escapeHtml(p.name)}</td>
        <td>${escapeHtml(p.category)}</td>
        <td class="num">${formatINR(p.selling_price)}</td>
        <td class="num">${formatINR(p.supplier_cost)}</td>
        <td class="num">${formatINR(profit)}</td>
        <td class="num">${margin.toFixed(1)}%</td>
        <td>${variants.length ? escapeHtml(variants.join(', ')) : 'Default'}</td>
        <td><span class="status-chip">${p.is_available ? 'In Stock' : 'Out of Stock'}</span></td>
        <td>
          <button class="btn btn-small" data-action="edit" data-id="${p.id}">Edit</button>
          <button class="btn btn-small btn-danger" data-action="delete" data-id="${p.id}">Delete</button>
          <button class="btn btn-small" data-action="toggle" data-id="${p.id}" data-available="${p.is_available ? '1' : '0'}">
            ${p.is_available ? 'Mark Out of Stock' : 'Mark In Stock'}
          </button>
        </td></tr>`;
    }).join('');
  } catch (err) {
    showToast('Could not load products: ' + err.message, true);
  }
}

document.getElementById('products-tbody').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  if (action === 'edit') {
    const p = _productsCache.find((x) => x.id === id);
    if (p) openProductForm(p);
  } else if (action === 'delete') {
    if (!confirm('Delete this product permanently?')) return;
    try {
      await api('/api/admin/products/' + id, { method: 'DELETE' });
      showToast('Product deleted');
      loadProducts();
    } catch (err) {
      showToast('Delete failed: ' + err.message, true);
    }
  } else if (action === 'toggle') {
    const isAvailable = btn.dataset.available === '1';
    btn.disabled = true;
    try {
      await api('/api/admin/products/' + id + '/availability', {
        method: 'PATCH', body: JSON.stringify({ is_available: !isAvailable }),
      });
      showToast(isAvailable ? 'Marked Out of Stock' : 'Marked In Stock');
      loadProducts();
    } catch (err) {
      showToast('Update failed: ' + err.message, true);
      btn.disabled = false;
    }
  }
});

document.getElementById('add-product-btn').addEventListener('click', () => openProductForm(null));
document.getElementById('cancel-product-btn').addEventListener('click', closeProductForm);

function openProductForm(product) {
  document.getElementById('product-form-wrap').classList.remove('hidden');
  document.getElementById('product-form-title').textContent = product ? 'Edit Product' : 'Add Product';
  document.getElementById('product-form-error').classList.add('hidden');
  document.getElementById('pf-id').value = product ? product.id : '';
  document.getElementById('pf-name').value = product ? product.name : '';
  document.getElementById('pf-description').value = product ? product.description : '';
  document.getElementById('pf-image').value = product ? (product.image_url || '') : '';
  _editingImages = [];
  if (product) {
    try {
      const parsed = JSON.parse(product.images || '[]');
      if (Array.isArray(parsed)) _editingImages = parsed.filter((u) => typeof u === 'string' && u);
    } catch {}
    if (!_editingImages.length && product.image_url) _editingImages = [product.image_url];
  }
  _selectedImageFiles = [];
  document.getElementById('pf-files').value = '';
  renderImagePreview();
  document.getElementById('pf-category').value = product ? product.category : 'General';
  document.getElementById('pf-price').value = product ? (product.selling_price / 100) : '';
  document.getElementById('pf-cost').value = product ? (product.supplier_cost / 100) : 0;
  let variants = [];
  if (product) { try { variants = JSON.parse(product.variants || '[]'); } catch {} }
  document.getElementById('pf-variants').value = variants.join(',');
  document.getElementById('pf-available').value = product && !product.is_available ? '0' : '1';
}
function closeProductForm() { document.getElementById('product-form-wrap').classList.add('hidden'); _selectedImageFiles = []; }

document.getElementById('product-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('product-form-error');
  errEl.classList.add('hidden');
  const submitButton = e.submitter || document.querySelector('#product-form button[type="submit"]');
  submitButton.disabled = true;

  let id = document.getElementById('pf-id').value;
  const variantsRaw = document.getElementById('pf-variants').value.trim();
  const variants = variantsRaw ? variantsRaw.split(',').map((v) => v.trim()).filter(Boolean) : [];
  const externalUrl = document.getElementById('pf-image').value.trim();
  const payload = {
    name: document.getElementById('pf-name').value.trim(),
    description: document.getElementById('pf-description').value.trim(),
    image_url: _editingImages[0] || externalUrl,
    images: _editingImages.slice(),
    category: document.getElementById('pf-category').value.trim() || 'General',
    selling_price: Math.round(Number(document.getElementById('pf-price').value) * 100),
    supplier_cost: Math.round(Number(document.getElementById('pf-cost').value) * 100),
    variants,
    is_available: document.getElementById('pf-available').value === '1',
  };

  try {
    if (id) {
      await api('/api/admin/products/' + id, { method: 'PUT', body: JSON.stringify(payload) });
    } else {
      const created = await api('/api/admin/products', { method: 'POST', body: JSON.stringify(payload) });
      id = created.id;
      document.getElementById('pf-id').value = id;
    }

    const uploaded = [];
    for (const file of _selectedImageFiles) {
      uploaded.push(await uploadProductImage(id, file));
    }
    const finalImages = [..._editingImages, ...uploaded].filter((url, index, arr) => arr.indexOf(url) === index).slice(0, 10);
    if (uploaded.length || finalImages.length) {
      payload.images = finalImages;
      payload.image_url = finalImages[0] || externalUrl;
      await api('/api/admin/products/' + id, { method: 'PUT', body: JSON.stringify(payload) });
    }

    showToast(id ? 'Product saved successfully' : 'Product created');
    closeProductForm();
    _selectedImageFiles = [];
    loadProducts();
  } catch (err) {
    errEl.textContent = err.message + (id ? ' Product record may already be saved; retry image upload or save again.' : '');
    errEl.classList.remove('hidden');
  } finally {
    submitButton.disabled = false;
  }
});
/* ═══════════════ Orders ═══════════════ */
async function loadOrders() {
  const wrap = document.getElementById('orders-list');
  wrap.innerHTML = '<p>Loading orders…</p>';
  try {
    const orders = await api('/api/admin/orders');
    if (!orders.length) { wrap.innerHTML = '<div class="card">No orders yet.</div>'; return; }
    wrap.innerHTML = orders.map((o) => `
      <div class="card">
        <details>
          <summary>
            <strong>${escapeHtml(o.id)}</strong> — ${escapeHtml(o.full_name)} — ${formatINR(o.total_amount)}
            <span class="status-chip" style="margin-left:8px">${escapeHtml(o.status)}</span>
          </summary>
          <div style="margin-top:14px">
            <p><strong>Mobile:</strong> ${escapeHtml(o.mobile)}${o.alt_mobile ? ' / ' + escapeHtml(o.alt_mobile) : ''}</p>
            <p><strong>Address:</strong> ${escapeHtml(o.house_flat)}, ${escapeHtml(o.street_locality)}
              ${o.landmark ? ', ' + escapeHtml(o.landmark) : ''}, ${escapeHtml(o.city)}, ${escapeHtml(o.district)},
              ${escapeHtml(o.state)} — ${escapeHtml(o.pin_code)}</p>
            <p><strong>Payment:</strong> ${escapeHtml(o.payment_method)}</p>
            <table style="margin-top:10px">
              <thead><tr><th>Product</th><th>Variant</th><th>Qty</th><th class="num">Unit</th><th class="num">Total</th></tr></thead>
              <tbody>${(o.items || []).map((i) => `<tr><td>${escapeHtml(i.product_name)}</td>
                <td>${escapeHtml(i.variant)}</td><td>${i.quantity}</td>
                <td class="num">${formatINR(i.unit_price)}</td><td class="num">${formatINR(i.line_total)}</td></tr>`).join('')}</tbody>
            </table>
            <div style="margin-top:12px">
              <label style="font-size:0.8rem;color:var(--muted)">Update status:</label>
              <select data-order-id="${o.id}" data-original="${escapeHtml(o.status)}" style="margin-left:8px;padding:6px">
                ${['Pending','Contacted','Confirmed','Supplier Ordered','Shipped','Delivered','Cancelled','Returned']
                  .map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>
        </details>
      </div>`).join('');
  } catch (err) {
    wrap.innerHTML = '<div class="error">Could not load orders: ' + escapeHtml(err.message) + '</div>';
  }
}

document.getElementById('orders-list').addEventListener('change', async (e) => {
  const sel = e.target.closest('select[data-order-id]');
  if (!sel) return;
  if (sel.dataset.busy === '1') {
    sel.value = sel.dataset.original || sel.value;
    return;
  }
  const originalValue = sel.dataset.original || sel.value;
  const newValue = sel.value;
  sel.dataset.busy = '1';
  sel.disabled = true;
  try {
    await api('/api/admin/orders/' + sel.dataset.orderId + '/status', {
      method: 'PATCH', body: JSON.stringify({ status: newValue }),
    });
    showToast('Order status updated to ' + newValue);
    await loadOrders();
  } catch (err) {
    sel.value = originalValue;
    showToast('Update failed: ' + err.message, true);
  } finally {
    sel.disabled = false;
    sel.dataset.busy = '0';
  }
});

(async function init() {
  try {
    await api('/api/admin/products');
    showDashboard();
    loadProducts();
  } catch {
    showLogin();
  }
})();
</script>
</body>
</html>
