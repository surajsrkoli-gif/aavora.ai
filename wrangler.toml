name = "aavora-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "aavora-db"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"

# ── Rate limiting (native Cloudflare Workers binding) ──────────────
# Free-tier compatible. `period` must be 10 or 60 seconds.
# Limits are approximate per Cloudflare location; see:
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/

[[ratelimits]]
name = "ORDER_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "BOOTSTRAP_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 3, period = 60 }

[vars]
# Exact production origin(s). Never use "*" with credentials.
ALLOWED_ORIGIN = "https://aavora.art"
# Optional second origin (e.g. www). Leave empty if unused.
ALLOWED_ORIGIN_2 = ""
