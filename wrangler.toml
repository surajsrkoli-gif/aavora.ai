
name = "aavora-ai-backend"
main = "worker.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "aavora-db"
database_id = "50eaffe1-adb6-44f4-9105-5a04b5b44d8b"

[[ratelimits]]
name = "ORDER_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "BOOTSTRAP_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 3, period = 60 }

[vars]
ALLOWED_ORIGIN = "https://aavora.art"
ALLOWED_ORIGIN_2 = ""
